# Netlify site settings:
#   Base directory = journal
#   (repo root is the monorepo; the Vite app is journal/)

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# SPA fallback for client-side navigation / refresh.
# /api/* is served by netlify/functions/cadence-api.ts (config.path).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
